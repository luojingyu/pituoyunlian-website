<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色参考图预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; }
h1 { text-align: center; margin: 20px 0 30px; color: #333; font-size: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; max-width: 1400px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.card img { width: 100%; height: 400px; object-fit: cover; display: block; }
.card .name { padding: 12px 16px; font-size: 18px; font-weight: bold; color: #333; text-align: center; }
.card .role { padding: 0 16px 12px; font-size: 13px; color: #888; text-align: center; }
</style>
</head>
<body>
<h1>智慧云厂 — 7 个核心角色参考图</h1>
<div class="grid">
  <div class="card"><img src="images/张总.png" alt="张总"><div class="name">张总</div><div class="role">老板/厂长 — 45岁，沉稳自信，体面精干</div></div>
  <div class="card"><img src="images/老赵.png" alt="老赵"><div class="name">老赵</div><div class="role">生产主任 — 50岁，懂技术的管理者</div></div>
  <div class="card"><img src="images/老王.png" alt="老王"><div class="name">老王</div><div class="role">销售总监 — 32-38岁，圆滑能说会道</div></div>
  <div class="card"><img src="images/阿强.png" alt="阿强"><div class="name">阿强</div><div class="role">技术员 — 25-30岁，技术宅男</div></div>
  <div class="card"><img src="images/陈姐.png" alt="陈姐"><div class="name">陈姐</div><div class="role">品质QC — 30-36岁，铁面无私</div></div>
  <div class="card"><img src="images/李主管.png" alt="李主管"><div class="name">李主管</div><div class="role">仓库主管 — 42-50岁，只认纸面单据</div></div>
  <div class="card"><img src="images/小刘.png" alt="小刘"><div class="name">小刘</div><div class="role">PMC计划员 — 28-35岁，年轻焦虑</div></div>
</div>
</body>
</html>
